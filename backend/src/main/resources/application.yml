spring:
  application:
    name: salary
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Overridden via JWT_SECRET env var in real deployments; this default is fine for local dev only.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
    expiration-minutes: 480
  seed:
    enabled: ${SEED_ON_STARTUP:false}
    employee-count: 10000
  admin:
    # The one HR Manager login. Override both via env vars for any real deployment.
    username: ${ADMIN_USERNAME:hr.manager}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server:
  port: ${PORT:8080}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/salarydb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

---
# Run against a real local Postgres (see backend/docker-compose.yml) instead of file-based H2,
# useful for confirming migrations/queries behave the same on real Postgres before deploying.
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://localhost:5432/salary
    username: salary
    password: salary
    driver-class-name: org.postgresql.Driver

---
# Built from individual host/port/database/user/password env vars (as provided by Render's
# Postgres `fromDatabase` blueprint wiring, see render.yaml) rather than a single DATABASE_URL,
# since that avoids depending on whichever URI scheme (postgres:// vs jdbc:postgresql://) the
# platform happens to hand back.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
