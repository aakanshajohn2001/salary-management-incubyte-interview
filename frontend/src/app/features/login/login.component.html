<div class="login-page">
  <mat-card class="login-card">
    <div class="login-mark" aria-hidden="true">A</div>
    <mat-card-header>
      <mat-card-title>ACME Salary Management</mat-card-title>
      <mat-card-subtitle>HR Manager sign in</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username" data-testid="username" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" data-testid="password" />
        </mat-form-field>

        @if (errorMessage()) {
          <p class="error" data-testid="error">{{ errorMessage() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" class="full-width" [disabled]="loading()" data-testid="submit">
          @if (loading()) {
            <mat-spinner diameter="20" />
          } @else {
            Sign in
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
