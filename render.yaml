databases:
  - name: acme-salary-db
    plan: free
    databaseName: salary
    user: salary

services:
  - type: web
    name: acme-salary-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: hr.manager
      - key: ADMIN_PASSWORD
        value: ChangeMe123!
      # Left true permanently: the 10k-employee seed is a fast no-op once
      # already seeded (a single count query), and the admin-login sync
      # (create-or-update-password) needs this to run on every boot so
      # rotating ADMIN_PASSWORD and restarting is enough to change the
      # live login, without touching the database directly.
      - key: SEED_ON_STARTUP
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://salary-management-incubyte-intervie.vercel.app
      - key: DB_HOST
        fromDatabase:
          name: acme-salary-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: acme-salary-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: acme-salary-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: acme-salary-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: acme-salary-db
          property: password
